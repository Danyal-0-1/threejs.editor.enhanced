<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="plot-title plot-description">
<title id="plot-title">Character length did not predict tokenizer cost</title>
<desc id="plot-description">The structural character proxy is compared with the binding tok/char fertility measurement</desc>
<style>
            text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #172033; }
            .title { font-size: 30px; font-weight: 700; }
